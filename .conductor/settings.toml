"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
available_in = [ "local" ]

[scripts.run.lint]
command = "npm run lint"

[scripts.run.build]
command = "npm run build"
